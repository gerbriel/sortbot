# Arcadian static SPA — nginx server block.
#
# The app has no router (AGENTS.md §6): navigation is state-driven and every
# visit lands on "/". The SPA fallback below therefore matters less than in a
# routed app, but it is still required so that a hard refresh on any path — and
# a sub-path deployment such as /sortbot/ behind a proxy — resolves to
# index.html instead of 404.
#
# Cache policy is the part that actually affects correctness:
#   * /assets/* filenames are content-hashed by Vite → immutable, cache forever.
#   * index.html must NEVER be cached, or a deploy stays invisible to returning
#     visitors until their browser happens to revalidate.
#   * sw.js must NEVER be cached, or the Service Worker can pin an old copy of
#     itself. public/sw.js:28 versions its cache name, which only takes effect
#     once the new sw.js is actually fetched.
#
# NGINX GOTCHA, deliberately handled below: add_header does NOT inherit into a
# location that sets any add_header of its own. The security headers are
# therefore repeated per location rather than set once at server level, where
# they would silently disappear from every location that sets Cache-Control.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Uploads go straight to Supabase Storage over TUS and never pass through
    # nginx, so a small body limit is safe.
    client_max_body_size 1m;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # ── Liveness ─────────────────────────────────────────────────────────────
    # Used by the container HEALTHCHECK, by compose, and by any k8s probe.
    # Intentionally cheap and dependency-free: it reports "nginx is serving",
    # not "Supabase is reachable" — the browser is the only client of Supabase,
    # so this container cannot meaningfully speak for it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Entry point: never cached ────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(self)" always;
        try_files $uri =404;
    }

    # ── Service Worker: never cached ─────────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Immutable, content-hashed build output ───────────────────────────────
    location /assets/ {
        access_log off;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Everything else: SPA fallback ────────────────────────────────────────
    location / {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(self)" always;
        try_files $uri $uri/ /index.html;
    }

    # No Content-Security-Policy is set here on purpose: the app talks to an
    # arbitrary Supabase project URL (baked in at build time) plus its Storage
    # CDN, so a correct connect-src/img-src list is environment-specific and a
    # wrong one breaks uploads silently. See deploy/README.md "Adding a CSP".
    #
    # Voice dictation (Step 3, Web Speech API) requires a secure context, so
    # serve this behind TLS in any real deployment; microphone=(self) above
    # keeps that permission available to the app itself.
}
