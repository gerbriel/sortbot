<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy (security audit 05, finding #12).
         GitHub Pages cannot send response headers, so a <meta http-equiv> is the
         only enforcement point available. The Supabase session (access AND
         refresh token) lives in localStorage, so any future XSS is a persistent
         account takeover — this is the mitigation that makes injected script
         useless.

         Every origin below was proved by grepping src/ + public/ and by reading
         the built bundle:
           script-src 'self'   dist/index.html has NO inline script (only
                               /assets/*.js) and no CDN script anywhere. The
                               apis.google.com loader and the huggingface calls
                               that used to be the only exceptions lived in
                               src/services/api.ts and src/lib/huggingfaceService.ts,
                               both since deleted as dead code — nothing in the
                               tree loads a remote script. No 'unsafe-eval': the
                               one `new Function` in the bundle is the
                               setimmediate polyfill's non-function argument
                               branch (via jszip), which jszip never takes.
           style-src           the inline <style> below, plus React's
                               style={{…}} attributes, need 'unsafe-inline'.
           img-src             Supabase Storage photos; images.unsplash.com
                               (Landing.tsx PHOTO); data: for the SVG select
                               arrow in ComprehensiveProductForm.css; blob: for
                               URL.createObjectURL upload previews.
           connect-src         Supabase REST/auth/storage/Edge Functions over
                               https, Realtime presence over wss, and the
                               self-hosted matting service at
                               matting.arcadian.ltd (photo backgrounds — it is
                               called with the user's own Supabase session JWT,
                               never a shared secret; see AGENTS.md §9). It is
                               named EXACTLY rather than wildcarded: this is the
                               one origin in the policy that is ours and not
                               Supabase's, and a wildcard there would buy
                               nothing and cover a subdomain nobody audited.
                               Nothing else is fetched. 'self' also covers the
                               dev server's ws:// HMR socket (CSP3 'self'
                               matches same-origin ws/wss); localhost:8080 for a
                               matting service run locally is appended by a
                               `command === 'serve'` plugin in vite.config.ts,
                               so it never reaches the built policy.
           worker-src          public/sw.js, same origin.
           font-src            system font stacks only; data: is belt-and-braces.

         DELIBERATELY ABSENT:
           frame-ancestors     MUST be ignored in a meta element per spec —
                               including it only logs a warning. Clickjacking
                               protection needs a real header, i.e. moving the
                               origin to a host that can send one (Cloudflare
                               Pages / Netlify), which also unlocks report-to
                               and HSTS.
           upgrade-insecure-requests
                               would rewrite the dev server's ws:// HMR socket to
                               wss:// and break `npm run dev`. It buys nothing
                               here: the app contains no http:// subresource. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com;
      font-src 'self' data:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://matting.arcadian.ltd;
      worker-src 'self';
      object-src 'none';
      base-uri 'none';
      form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page paint into the iPhone's rounded-corner
         and home-indicator regions, which is what makes `env(safe-area-inset-*)`
         report anything other than 0. The fixed bottom tab bar, the support
         widget and the toast stack all pad themselves with those insets; without
         this flag they would be flush to the edge AND the insets would be zero,
         so the home indicator would sit on top of the tab bar's labels. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Arcadian turns a camera roll of vintage clothing photos into Shopify-ready listings." />
    <title>Arcadian</title>
    <!-- Link previews (Open Graph + Twitter card). Crawlers need ABSOLUTE URLs
         and never run JS, so these are static. og.png, apple-touch-icon.png
         and the manifest icons come from assets/make-sources.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arcadian" />
    <meta property="og:title" content="Arcadian: vintage clothing photos to Shopify listings" />
    <meta property="og:description" content="Arcadian turns a camera roll of vintage clothing photos into Shopify-ready listings." />
    <meta property="og:url" content="https://arcadian.ltd/" />
    <meta property="og:image" content="https://arcadian.ltd/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Arcadian logo: a black A tile beside the word Arcadian." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arcadian: vintage clothing photos to Shopify listings" />
    <meta name="twitter:description" content="Arcadian turns a camera roll of vintage clothing photos into Shopify-ready listings." />
    <meta name="twitter:image" content="https://arcadian.ltd/og.png" />
    <!-- CSP unchanged: default-src 'self' covers the same-origin manifest, and img-src 'self' the icons. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Paint the canvas before the bundle loads so there is no flash of the
         wrong colour between first paint and the stylesheet. -->
    <style>
      html { background: #ffffff; }
      body { background: #ffffff; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
